<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VBASE · Review</title><link rel="icon" type="image/svg+xml" href="/logo/vbase-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VBASE review room — Swiss/minimal, monochrome like a deployment dashboard. Black ground, hairline borders,
   white primary actions, blue only for focus and links, green only for "resolved". Mono for numbers and names. */
:root{
  --bg:#000;--card:#0A0A0A;--hover:#111;--subtle:#161616;
  --b1:#1F1F1F;--b2:#2E2E2E;--b3:#454545;
  --fg:#EDEDED;--fg2:#A1A1A1;--fg3:#7C7C7C;
  --blue:#0A72EF;--blue-soft:rgba(10,114,239,.14);--green:#45A557;--green-soft:rgba(69,165,87,.14);--amber:#F5A524;--red:#F04438;
  --r:6px;--r-lg:12px;--t:150ms ease;
  --sans:"Geist",Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.mono{font-family:var(--mono)}

/* ---------- nav: breadcrumb ---------- */
nav{position:sticky;top:0;z-index:30;height:56px;display:flex;align-items:center;gap:6px;padding:0 24px;background:rgba(0,0,0,.85);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--b1)}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.02em;font-size:15px}
.logo svg{width:24px;height:24px}
.slash{width:22px;height:22px;color:var(--b3)}
.crumb{color:var(--fg2);font-size:14px;padding:4px 6px;border-radius:var(--r)}
.switch{position:relative;display:flex;align-items:center}
.switch select{appearance:none;-webkit-appearance:none;background:transparent;border:0;height:32px;padding:0 28px 0 8px;border-radius:var(--r);font:500 14px var(--sans);color:var(--fg);cursor:pointer;transition:background var(--t)}
.switch select:hover{background:var(--subtle)}
.switch svg{position:absolute;right:6px;pointer-events:none;color:var(--fg3)}
.grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r);border:1px solid var(--b2);background:var(--card);color:var(--fg);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap;transition:background var(--t),border-color var(--t),color var(--t)}
.btn:hover{background:var(--hover);border-color:var(--b3)}
.btn.white{background:var(--fg);color:#0A0A0A;border-color:var(--fg)}
.btn.white:hover{background:#fff;border-color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--fg2)}.btn.ghost:hover{color:var(--fg);background:var(--subtle)}
.btn.sq{width:36px;padding:0}
.btn:disabled{opacity:.5;cursor:default}
.field-s{display:flex;align-items:center;gap:8px;color:var(--fg3);font-size:13px;margin-right:8px}
.field-s .switch select{border:1px solid var(--b2);height:36px;background:var(--card);font-size:13px}
.field-s .switch select:hover{border-color:var(--b3)}

/* ---------- overview strip (deployment-style) ---------- */
.overview{border-bottom:1px solid var(--b1)}
.wrap{max-width:1480px;margin:0 auto;padding:0 32px}
.ov{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-top:28px;padding-bottom:22px}
.ov h1{margin:0;font-size:28px;line-height:1.15;font-weight:600;letter-spacing:-.025em}
.ov .sub{margin-top:6px;color:var(--fg2);font-size:14px}
.facts{display:grid;grid-template-columns:repeat(5,auto);gap:0 36px}
.fact dt{color:var(--fg3);font-size:12px;margin-bottom:4px}
.fact dd{margin:0;font:500 14px var(--mono);color:var(--fg);display:flex;align-items:center;gap:7px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}

/* ---------- workspace ---------- */
main.wrap{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;padding-top:24px;padding-bottom:40px;align-items:start}
.card{background:var(--card);border:1px solid var(--b1);border-radius:var(--r-lg);overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;height:48px;padding:0 16px;border-bottom:1px solid var(--b1);font-size:13px;color:var(--fg2)}
.card-h b{color:var(--fg);font-weight:500}
#stage{display:grid;grid-template-columns:1fr;background:#000}#stage.two{grid-template-columns:1fr 1fr;gap:1px;background:var(--b1)}
.vid{position:relative;background:#000;aspect-ratio:16/9}
.vid video{width:100%;height:100%;display:block}
.vid .tag{display:none}
#boxB .tag{display:block;position:absolute;left:10px;top:10px;font:500 12px var(--mono);color:var(--fg2);background:rgba(0,0,0,.7);border:1px solid var(--b2);padding:3px 8px;border-radius:var(--r)}
#hit{position:absolute;inset:0;cursor:crosshair}
.pin{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(10,114,239,.9),0 0 0 12px rgba(10,114,239,.18);pointer-events:none;animation:pin .18s ease-out}
@keyframes pin{from{transform:scale(.5);opacity:0}to{transform:none;opacity:1}}
/* transport, attached to the foot of the player card */
#bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--b1)}
#play{width:36px}
#seekwrap{position:relative;flex:1;height:36px;display:flex;align-items:center;margin:0 6px}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;margin:0;border-radius:4px;cursor:pointer;background:linear-gradient(90deg,var(--fg) var(--p,0%),var(--b2) var(--p,0%))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;border:0;box-shadow:0 0 0 4px rgba(255,255,255,.12)}
#seek::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
#marks{position:absolute;left:0;right:0;top:2px;height:8px;pointer-events:none}
#marks i{position:absolute;width:2px;height:8px;margin-left:-1px;background:var(--blue);border-radius:1px}#marks i.done{background:var(--green)}
#time{font:400 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--fg3);min-width:200px;text-align:right}#time b{color:var(--fg);font-weight:500}
#tc{font:500 13px var(--mono);color:var(--fg)}
#hint{display:flex;flex-wrap:wrap;gap:6px 18px;padding:14px 4px 0;color:var(--fg3);font-size:13px}
#hint span{display:inline-flex;align-items:center;gap:6px}
kbd{font:500 11px var(--mono);color:var(--fg2);background:var(--subtle);border:1px solid var(--b2);border-radius:4px;padding:1px 5px;min-width:20px;text-align:center}

/* ---------- comments ---------- */
#right{position:sticky;top:80px;display:flex;flex-direction:column;max-height:calc(100vh - 104px)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{height:28px;padding:0 10px;border:0;border-radius:var(--r);background:transparent;color:var(--fg3);font-size:13px;cursor:pointer;transition:color var(--t),background var(--t)}
.tabs button:hover{color:var(--fg)}.tabs button[aria-selected=true]{color:var(--fg);background:var(--subtle)}
.tabs .n{font-family:var(--mono);margin-left:4px;color:var(--fg3)}
#compose{padding:14px 16px;border-bottom:1px solid var(--b1)}
#where{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg3);margin-bottom:8px;min-height:18px}
#where.on{color:var(--blue)}
.box{border:1px solid var(--b2);border-radius:var(--r-lg);background:#000;transition:border-color var(--t),box-shadow var(--t)}
.box:focus-within{border-color:var(--b3);box-shadow:0 0 0 3px rgba(255,255,255,.06)}
textarea{display:block;width:100%;min-height:84px;padding:12px;resize:vertical;border:0;background:transparent;line-height:1.5;outline:none}
textarea::placeholder{color:var(--fg3)}
.box-f{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 8px;border-top:1px solid var(--b1)}
.seg{display:flex;gap:2px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:0;border-radius:var(--r);background:transparent;color:var(--fg3);font-size:12px;cursor:pointer;transition:color var(--t),background var(--t)}
.seg button:hover{color:var(--fg);background:var(--subtle)}
.box-f .btn{height:30px;padding:0 10px;font-size:13px;margin-left:auto}
.box-f .btn kbd{background:rgba(0,0,0,.08);border-color:rgba(0,0,0,.18);color:#444}
#list{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:12px 16px;border-bottom:1px solid var(--b1);transition:background var(--t)}
.row:last-child{border-bottom:0}.row:hover{background:var(--hover)}
.row.nothumb{grid-template-columns:1fr}
.thumb{position:relative;width:104px;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;border:1px solid var(--b2);background:#000;padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.top{display:flex;align-items:center;gap:8px;font-size:12px}
.when{font:500 12px var(--mono);color:var(--fg);background:none;border:0;padding:0;cursor:pointer}
.when:hover{color:var(--blue);text-decoration:underline}
.when.static{cursor:default;color:var(--fg2)}.when.static:hover{color:var(--fg2);text-decoration:none}
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:500;border:1px solid var(--b2);color:var(--fg2)}
.badge i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
.badge.ok{color:var(--green);border-color:rgba(69,165,87,.35);background:var(--green-soft)}.badge.ok i{background:var(--green)}
.ago{color:var(--fg3);margin-left:auto;white-space:nowrap}
.acts{display:flex;gap:2px;opacity:0;transition:opacity var(--t)}
.row:hover .acts,.row:focus-within .acts{opacity:1}
.acts button{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:var(--r);background:transparent;color:var(--fg3);cursor:pointer}
.acts button:hover{background:var(--subtle);color:var(--fg)}.acts button.del:hover{color:var(--red)}
.row p{margin:6px 0 0;white-space:pre-wrap;font-size:14px;color:var(--fg)}
.row.done p{color:var(--fg3);text-decoration:line-through}.row.done .thumb{opacity:.5}
.empty{padding:40px 24px;text-align:center;color:var(--fg3);font-size:13px}
.empty .ring{width:40px;height:40px;margin:0 auto 12px;border-radius:50%;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;color:var(--fg2)}
#toast{position:fixed;right:24px;bottom:24px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--b2);border-radius:var(--r-lg);padding:12px 16px;font-size:14px;box-shadow:0 16px 40px -12px rgba(0,0,0,.8);opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity var(--t),transform var(--t);z-index:50}
#toast.show{opacity:1;transform:none}#toast svg{color:var(--green)}
@media (max-width:1180px){main.wrap{grid-template-columns:1fr}#right{position:static;max-height:none}.facts{grid-template-columns:repeat(3,auto);gap:12px 28px}.ov{flex-direction:column;align-items:flex-start}}
@media (max-width:960px){.field-s{display:none}}
@media (max-width:720px){.wrap{padding-left:16px;padding-right:16px}nav{padding:0 12px}#time{min-width:0}#project,#project+.slash{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.5" y="5" width="3.5" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="3.5" height="14" rx="1" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></symbol>
  <symbol id="i-updown" viewBox="0 0 24 24"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></symbol>
  <symbol id="i-slash" viewBox="0 0 24 24"><path d="M16 3L8 21"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></symbol>
  <symbol id="i-frame" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></symbol>
  <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-msg" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
</svg>
<nav aria-label="Breadcrumb">
  <span class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" aria-hidden="true">  <defs>    <linearGradient id="g-l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFCFCF"/></linearGradient>    <linearGradient id="g-r" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3A3A3"/><stop offset="1" stop-color="#474747"/></linearGradient>  </defs>  <g stroke-linejoin="round" stroke-width="2.6">    <path d="M5 5.5 H19 V28.5 Z" fill="url(#g-l)" stroke="url(#g-l)"/>    <path d="M21 5.5 H35 L21 28.5 Z" fill="url(#g-r)" stroke="url(#g-r)"/>  </g>  <rect x="4.5" y="33.5" width="31" height="2.6" rx="1.3" fill="#333"/>  <rect x="4.5" y="33.5" width="12.5" height="2.6" rx="1.3" fill="#FFF"/>  <circle cx="17" cy="34.8" r="2.6" fill="#FFF"/></svg>VBASE</span>
  <svg class="i slash"><use href="#i-slash"/></svg><span class="crumb" id="project">project</span>
  <svg class="i slash"><use href="#i-slash"/></svg>
  <label class="switch" for="cut" title="Switch cut"><select id="cut" aria-label="Cut"></select><svg class="i"><use href="#i-updown"/></svg></label>
  <span class="grow"></span>
  <label class="field-s" for="cmp">Compare <span class="switch"><select id="cmp"><option value="">None</option></select><svg class="i"><use href="#i-updown"/></svg></span></label>
  <button class="btn white" id="send">Send notes to Claude <svg class="i"><use href="#i-arrow"/></svg></button>
</nav>
<section class="overview"><div class="wrap ov">
  <div><h1 id="title">Review</h1><div class="sub">Click the picture to pin a note on that exact frame.</div></div>
  <dl class="facts">
    <div class="fact"><dt>Status</dt><dd><span class="dot"></span>Ready</dd></div>
    <div class="fact"><dt>Duration</dt><dd id="fDur">—</dd></div>
    <div class="fact"><dt>Frames</dt><dd id="fFrames">—</dd></div>
    <div class="fact"><dt>Resolution</dt><dd id="fRes">—</dd></div>
    <div class="fact"><dt>Open notes</dt><dd id="count">0</dd></div>
  </dl></div></section>
<main class="wrap"><section id="left">
  <div class="card">
    <div class="card-h"><svg class="i"><use href="#i-film"/></svg><b id="tagA"></b><span class="grow"></span><span id="tc">0:00.00</span></div>
    <div id="stage"><div class="vid"><video id="v" playsinline preload="auto"></video><div id="hit" role="button" aria-label="Click to pin a note on this spot of the frame"></div></div>
      <div class="vid" id="boxB" style="display:none"><video id="w" playsinline muted preload="auto"></video><div class="tag" id="tagB"></div></div></div>
    <div id="bar">
      <button class="btn white sq" id="play" aria-label="Play"><svg class="i"><use href="#i-play"/></svg></button>
      <button class="btn sq" id="back" title="One frame back" aria-label="One frame back"><svg class="i"><use href="#i-back"/></svg></button>
      <button class="btn sq" id="fwd" title="One frame forward" aria-label="One frame forward"><svg class="i"><use href="#i-fwd"/></svg></button>
      <div id="seekwrap"><div id="marks"></div><input id="seek" type="range" min="0" max="1" step="0.001" value="0" aria-label="Seek"></div>
      <span id="time"></span></div>
  </div>
  <div id="hint"><span><kbd>Space</kbd> Play / pause</span><span><kbd>←</kbd><kbd>→</kbd> Step a frame</span><span><kbd>⇧</kbd><kbd>←</kbd><kbd>→</kbd> Step a second</span><span><kbd>↵</kbd> Save note</span><span><kbd>⇧</kbd><kbd>↵</kbd> New line</span></div>
</section>
<aside id="right" class="card">
  <div class="card-h"><b>Comments</b><span id="count2" class="mono" style="color:var(--fg3)">0</span>
    <div class="tabs" role="tablist" aria-label="Filter notes"><button role="tab" data-f="all" aria-selected="true">All</button><button role="tab" data-f="open" aria-selected="false">Open<span class="n" id="nOpen">0</span></button><button role="tab" data-f="done" aria-selected="false">Resolved<span class="n" id="nDone">0</span></button></div></div>
  <div id="compose">
    <div id="where"><svg class="i" style="width:14px;height:14px"><use href="#i-pin"/></svg><span id="whereT">Click on the picture, or write a note about the whole film.</span></div>
    <div class="box"><label for="text" style="position:absolute;left:-9999px">Note</label><textarea id="text" placeholder="Leave a note…"></textarea>
      <div class="box-f"><div class="seg"><button id="nopin" title="Note on this frame, no pin"><svg class="i"><use href="#i-frame"/></svg>Frame</button><button id="whole" title="Note on the whole film"><svg class="i"><use href="#i-film"/></svg>Whole film</button></div>
        <button class="btn white" id="add">Comment <kbd>↵</kbd></button></div></div>
  </div>
  <div id="list"></div>
</aside></main>
<div id="toast" role="status"><svg class="i"><use href="#i-check"/></svg><span id="toastT"></span></div>
<script>
const $=(id)=>document.getElementById(id),v=$('v'),w=$('w'),FPS=30;let cuts=[],notes=[],pin=null,mode='pin',filt='all';
const ico=(n)=>`<svg class="i"><use href="#i-${n}"/></svg>`;
const fmt=(t)=>{const m=Math.floor(t/60),s=t-m*60;return m+':'+s.toFixed(2).padStart(5,'0');};
const ago=(iso)=>{const s=(Date.now()-new Date(iso))/1000;if(!(s>=0))return'';if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';};
const api=(p,o)=>fetch(p,o).then((r)=>r.json());
const toast=(s)=>{$('toastT').textContent=s;const t=$('toast');t.classList.add('show');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('show'),2600);};
const where=(s,on)=>{$('whereT').textContent=s;$('where').classList.toggle('on',!!on);};
async function boot(){cuts=await api('/api/cuts');for(const c of cuts){$('cut').add(new Option(c.name.replace('.mp4',''),c.name));$('cmp').add(new Option(c.name.replace('.mp4',''),c.name));}
  const want=localStorage.getItem('rr-cut');if(want&&cuts.some((c)=>c.name===want))$('cut').value=want;setCut();await refresh();}
function setCut(){const n=$('cut').value.replace('.mp4','');v.src='/video/'+encodeURIComponent($('cut').value);$('tagA').textContent=n+'.mp4';$('title').textContent=n;document.title=n+' · VBASE';$('project').textContent=(n.split(/[-_]/)[0]||'project');localStorage.setItem('rr-cut',$('cut').value);clearPin();draw();}
function setCmp(){const n=$('cmp').value;$('boxB').style.display=n?'':'none';$('stage').className=n?'two':'';if(n){w.src='/video/'+encodeURIComponent(n);$('tagB').textContent=n.replace('.mp4','')+' · compare';w.currentTime=v.currentTime;}else w.removeAttribute('src');}
async function refresh(){notes=(await api('/api/notes')).notes;draw();}
function mine(){return notes.filter((n)=>n.cut===$('cut').value).sort((a,b)=>(a.t??-1)-(b.t??-1));}
function draw(){const L=$('list');L.innerHTML='';const all=mine(),open=all.filter((n)=>!n.done).length;
  $('count').textContent=open;$('count2').textContent=all.length;$('nOpen').textContent=open;$('nDone').textContent=all.length-open;
  const ns=all.filter((n)=>filt==='all'||(filt==='open'?!n.done:n.done));
  if(!ns.length)L.innerHTML=`<div class="empty"><div class="ring">${ico('msg')}</div>${all.length?'Nothing here with this filter.':'No comments on this cut yet.<br>Click the picture to pin the first one.'}</div>`;
  for(const n of ns){const d=document.createElement('div');d.className='row'+(n.done?' done':'')+(n.shot?'':' nothumb');
    const whole=n.t===null,when=whole?'Whole film':fmt(n.t);
    const im=n.shot?`<button class="thumb" aria-label="Jump to ${when}"><img src="/${n.shot}?${n.id}" alt="Frame at ${when}"></button>`:'';
    d.innerHTML=`${im}<div><div class="top"><button class="when t ${whole?'static':''}">${when}</button>${n.done?'<span class="badge ok"><i></i>Resolved</span>':`<span class="badge"><i></i>${whole?'Film':n.x===null?'Frame':'Pinned'}</span>`}
      <span class="ago">${ago(n.at)}</span><span class="acts"><button data-a="done" aria-label="${n.done?'Reopen':'Resolve'}" title="${n.done?'Reopen':'Resolve'}">${ico(n.done?'undo':'check')}</button><button class="del" data-a="del" aria-label="Delete" title="Delete">${ico('trash')}</button></span></div><p></p></div>`;
    d.querySelector('p').textContent=n.text;
    const jump=()=>{if(n.t!==null){v.pause();v.currentTime=n.t;showPin(n.x,n.y);}};d.querySelector('.t').onclick=jump;if(n.shot)d.querySelector('.thumb').onclick=jump;
    d.querySelector('[data-a=del]').onclick=async()=>{await fetch('/api/notes/'+n.id,{method:'DELETE'});refresh();};
    d.querySelector('[data-a=done]').onclick=async()=>{await api('/api/notes/'+n.id,{method:'POST',body:JSON.stringify({done:!n.done})});refresh();};L.appendChild(d);}
  const M=$('marks');M.innerHTML='';if(v.duration)for(const n of all)if(n.t!==null){const i=document.createElement('i');i.style.left=(n.t/v.duration*100)+'%';if(n.done)i.className='done';M.appendChild(i);}}
document.querySelectorAll('.tabs button').forEach((b)=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('.tabs button').forEach((x)=>x.setAttribute('aria-selected',x===b));draw();});
function showPin(x,y){document.querySelectorAll('.pin').forEach((p)=>p.remove());if(x===null||x===undefined)return;const p=document.createElement('div');p.className='pin';p.style.left=x*100+'%';p.style.top=y*100+'%';$('hit').appendChild(p);}
function clearPin(){pin=null;mode='pin';showPin(null);where('Click on the picture, or write a note about the whole film.');}
$('hit').onclick=(e)=>{const r=$('hit').getBoundingClientRect();v.pause();pin={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};mode='pin';showPin(pin.x,pin.y);where('Pinned at '+fmt(v.currentTime)+' · frame '+Math.round(v.currentTime*FPS),true);$('text').focus();};
$('nopin').onclick=()=>{v.pause();pin=null;mode='frame';showPin(null);where('On the frame at '+fmt(v.currentTime),true);$('text').focus();};
$('whole').onclick=()=>{pin=null;mode='whole';showPin(null);where('On the whole film',true);$('text').focus();};
function shot(){const c=document.createElement('canvas');c.width=960;c.height=540;const g=c.getContext('2d');g.drawImage(v,0,0,960,540);
  if(pin){g.lineWidth=6;g.strokeStyle='#0A72EF';g.fillStyle='#fff';g.beginPath();g.arc(pin.x*960,pin.y*540,13,0,7);g.fill();g.stroke();}return c.toDataURL('image/jpeg',0.85);}
async function add(){const text=$('text').value.trim();if(!text){$('text').focus();return;}if(mode==='pin'&&!pin)mode=v.paused&&v.currentTime>0?'frame':'whole';
  const b={cut:$('cut').value,text};if(mode!=='whole'){b.t=v.currentTime;b.shot=shot();if(pin){b.x=pin.x;b.y=pin.y;}}
  $('add').disabled=true;try{await api('/api/notes',{method:'POST',body:JSON.stringify(b)});$('text').value='';clearPin();await refresh();toast('Comment saved');}finally{$('add').disabled=false;}}
$('add').onclick=add;$('text').addEventListener('keydown',(e)=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add();}});
$('send').onclick=async()=>{$('send').disabled=true;try{await api('/api/send',{method:'POST',body:JSON.stringify({cut:$('cut').value})});toast('Sent — Claude can read your notes now.');}finally{$('send').disabled=false;}};
const step=(d)=>{v.pause();v.currentTime=Math.max(0,Math.min(v.duration||0,Math.round(v.currentTime*FPS+d)/FPS));};
const setPlay=(on)=>{$('play').innerHTML=ico(on?'pause':'play');$('play').setAttribute('aria-label',on?'Pause':'Play');};
$('play').onclick=()=>v.paused?v.play():v.pause();$('back').onclick=()=>step(-1);$('fwd').onclick=()=>step(1);
$('seek').oninput=()=>{v.currentTime=$('seek').value*(v.duration||0);};
v.onplay=()=>{setPlay(true);showPin(null);if(w.src){w.currentTime=v.currentTime;w.play();}};v.onpause=()=>{setPlay(false);if(w.src){w.pause();w.currentTime=v.currentTime;}};
v.onseeked=()=>{if(w.src&&v.paused)w.currentTime=v.currentTime;};
v.onloadedmetadata=()=>{$('fDur').textContent=fmt(v.duration);$('fFrames').textContent=Math.round(v.duration*FPS).toLocaleString()+' @ '+FPS;$('fRes').textContent=v.videoWidth+'×'+v.videoHeight;draw();};
v.ontimeupdate=()=>{const p=v.duration?v.currentTime/v.duration:0;$('seek').value=p;$('seek').style.setProperty('--p',(p*100)+'%');
  $('time').innerHTML='<b>'+fmt(v.currentTime)+'</b> / '+fmt(v.duration||0)+' · f'+Math.round(v.currentTime*FPS);$('tc').textContent=fmt(v.currentTime);};
$('cut').onchange=()=>{setCut();};$('cmp').onchange=setCmp;
document.addEventListener('keydown',(e)=>{const tg=e.target.tagName;if(tg==='TEXTAREA'||tg==='SELECT')return;if(e.code==='Space'&&tg!=='BUTTON'){e.preventDefault();$('play').onclick();}if(e.key==='ArrowLeft'){e.preventDefault();step(e.shiftKey?-FPS:-1);}if(e.key==='ArrowRight'){e.preventDefault();step(e.shiftKey?FPS:1);}});
setInterval(()=>document.querySelectorAll('.ago').length&&draw(),60000);
boot();
</script></body></html>
