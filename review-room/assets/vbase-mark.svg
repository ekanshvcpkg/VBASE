<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="VBASE">
  <defs>
    <linearGradient id="vb-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C1C1E"/><stop offset="1" stop-color="#050505"/></linearGradient>
    <linearGradient id="vb-rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A5A5A"/><stop offset=".35" stop-color="#2A2A2A"/><stop offset="1" stop-color="#1A1A1A"/></linearGradient>
    <linearGradient id="vb-l" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFCFCF"/></linearGradient>
    <linearGradient id="vb-r" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A3A3A3"/><stop offset="1" stop-color="#474747"/></linearGradient>
  </defs>
  <!-- tile: dark gradient with a lit top rim -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="url(#vb-bg)" stroke="url(#vb-rim)"/>
  <!-- V: a play button turned down, two faces with a hairline gap, light from the top left -->
  <g stroke-linejoin="round" stroke-width="3">
    <path d="M15.5 16.5 H31 V42 Z" fill="url(#vb-l)" stroke="url(#vb-l)"/>
    <path d="M33 16.5 H48.5 L33 42 Z" fill="url(#vb-r)" stroke="url(#vb-r)"/>
  </g>
  <!-- base: a timeline with a playhead -->
  <rect x="15" y="48" width="34" height="3" rx="1.5" fill="#2E2E2E"/>
  <rect x="15" y="48" width="14" height="3" rx="1.5" fill="#FFFFFF"/>
  <circle cx="29" cy="49.5" r="3" fill="#FFFFFF"/>
</svg>
